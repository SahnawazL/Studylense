name: Deploy Firebase rules

# Tests firestore.rules, then publishes the Firestore and Storage rules whenever
# they change on main (or manually from the Actions tab). Needs the
# FIREBASE_SERVICE_ACCOUNT repository secret.
# If the tests fail, nothing is published and the live rules stay unchanged.
on:
  push:
    branches: [main]
    paths: [firestore.rules, storage.rules, firebase.json, tests/rules.test.mjs, scripts/deploy-rules.mjs, .github/workflows/deploy-firebase-rules.yml]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firebase-rules
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test the rules
        run: |
          npm i --no-save firebase@10 @firebase/rules-unit-testing@3 > /dev/null
          npx -y firebase-tools@14 emulators:exec --only firestore --project demo-studylens "node tests/rules.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-rules.mjs
